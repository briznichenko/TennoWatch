# SwiftLint config for WarframeListener.
# Keep this focused on catching real mistakes (unsafe unwraps, force casts),

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message

disabled_rules:
  - inclusive_language
  - todo
  - trailing_whitespace

excluded:
  - .build
  - DerivedData
  - Generated/ExternalData.swift

line_length:
  warning: 120
  error: 400

force_cast: warning
force_try: warning
force_unwrapping: warning

identifier_name:
  min_length: 2

reporter: "xcode"
