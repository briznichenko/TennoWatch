# SwiftLint config for WarframeListener.
# Keep this focused on catching real mistakes (unsafe unwraps, force casts),
# not style nitpicks — this is a learning project, not a style exercise.

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - first_where
  - redundant_nil_coalescing
  - sorted_imports
  - closure_spacing
  - empty_count

disabled_rules:
  - todo

excluded:
  - .build
  - DerivedData

line_length:
  warning: 120
  error: 160

force_cast: warning
force_try: warning
force_unwrapping: warning

identifier_name:
  min_length: 2

reporter: "xcode"
