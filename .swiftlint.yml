# SwiftLint config for TennoWatch.
# Catch real mistakes (unsafe unwraps, force casts). Metrics and formatting are off.

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - fatal_error_message
  - unowned_variable_capture
  - discarded_notification_center_observer
  - empty_count

disabled_rules:
  # size metrics — measure nothing about correctness
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - function_parameter_count
  - cyclomatic_complexity
  - large_tuple
  - nesting
  # style noise
  - multiple_closures_with_trailing_closure
  - trailing_whitespace
  - inclusive_language

excluded:
  - .build
  - DerivedData
  - Generated

identifier_name:
  min_length:
    warning: 1
    error: 0
  max_length:
    warning: 80
    error: 100

force_cast: warning
force_try: warning
force_unwrapping: warning
implicitly_unwrapped_optional: warning

reporter: "xcode"
